<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | EmpowerTech</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<!-- ================= NAVBAR ================= -->

<nav>

    <div class="logo">
        <i class="fa-solid fa-laptop-code"></i>
        EmpowerTech
    </div>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#learning">Learning Hub</a></li>
    </ul>

</nav>

<!-- ================= HERO ================= -->

<section class="page-hero">

    <h1>🔐 Student Login</h1>

    <p>
        Log in to see your dashboard, track your course progress,
        and keep your favorite resources in one place.
    </p>

</section>

<!-- ================= LOGIN + REGISTER ================= -->

<section class="resources">

    <p id="auth-message" role="status"></p>

    <div class="auth-grid">

        <!-- Login -->
        <form id="login-form" class="auth-form">

            <h2>Log in</h2>

            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email"
                   placeholder="you@example.com" autocomplete="username" required>

            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password"
                   placeholder="Your password" autocomplete="current-password" required>

            <button type="submit" class="primary">Log in</button>

        </form>

        <!-- Register -->
        <form id="register-form" class="auth-form">

            <h2>Create an account</h2>

            <label for="register-name">Full name</label>
            <input type="text" id="register-name" name="name"
                   placeholder="Your name" maxlength="60" autocomplete="name" required>

            <label for="register-email">Email</label>
            <input type="email" id="register-email" name="email"
                   placeholder="you@example.com" autocomplete="email" required>

            <label for="register-password">Password (at least 6 characters)</label>
            <input type="password" id="register-password" name="password"
                   placeholder="Choose a password" minlength="6" maxlength="100"
                   autocomplete="new-password" required>

            <button type="submit" class="primary">Create account</button>

        </form>

    </div>

</section>

<!-- ================= FOOTER ================= -->

<footer>

    <p>&copy; 2026 EmpowerTech. All Rights Reserved.</p>

</footer>

<script src="script.js"></script>
</body>
</html>
